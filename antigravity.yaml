version: 2.0

# Global Settings
settings:
  # Forces the CLI to pause and request your manual approval (ctrl+k) before running code or git commits
  require_approval: true 
  
# The primary orchestrator handling context and task delegation
orchestrator:
  model: "gemini-3.1-pro" 
  
# Dedicated subagents for specific tasks
subagents:
  coder:
    model: "claude-4.6-sonnet"
    system_prompt: "You are a strict code generator. Output only syntactically perfect Python."
    temperature: 0.1
  
  debugger:
    model: "claude-4.6-opus"
    system_prompt: "You are an AI architect. Deeply analyze PyTorch matrix and tensor shape errors."
